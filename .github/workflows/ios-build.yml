name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare xcconfig
        run: |
          cd src/ios
          cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      # M1 note: the iSH sandbox rootfs (alpine-rootfs.zip, RootfsPatch.bundle)
      # is generated by deps/prepare_alpine_rootfs.sh and is not committed.
      # The remote-agent feature (M1) does not use the sandbox, so stubs pass
      # the Resources build phase; real assets land before local-agent use.
      - name: Stub sandbox resources (M1)
        run: |
          mkdir -p deps/resources
          touch deps/resources/alpine-rootfs.zip
          mkdir -p deps/resources/RootfsPatch.bundle

      - name: Build (unsigned)
        run: |
          cd src/ios
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-app
          path: src/ios/build/DerivedData/Build/Products/Debug-iphoneos/*.app
          if-no-files-found: error
