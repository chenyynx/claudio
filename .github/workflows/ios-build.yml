name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Project targets iOS 26.2 / Swift 6.0 — macos-15's Xcode 16.4 (iOS 18.5
    # SDK) fails on upstream code (glassEffect etc.). Need Xcode 26.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps toolchain
        run: |
          # lld is a separate Homebrew formula since LLVM was split (2026).
          # brew meson instead of pip3: runner Python is PEP-668 managed.
          brew install meson ninja llvm lld libarchive pkg-config

      - name: Prepare xcconfig
        run: |
          cd src/ios
          cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Cache native deps build artifacts
        # [Fix] Re-designed after 8e41c86 rollback: cache PRODUCT dirs only
        # (never source trees). Source-presence checks in build_ffmpeg.sh /
        # build_lame.sh are now file-level (ffmpeg.c / configure), so a
        # restored empty source dir no longer skips the download.
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/ish/build-ios
          key: deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh', 'deps/build_ish.sh', 'deps/build_proot.sh') }}

      - name: Cache xcodebuild DerivedData
        # Swift compile artifacts: with SWIFT_COMPILATION_MODE default (WMO)
        # restored, only files touched since the last build recompile, so a
        # warm cache turns a full 15-min build into ~5-8 min. Keyed on the
        # source tree hash — any source change invalidates it.
        uses: actions/cache@v4
        with:
          path: src/ios/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('src/ios/**') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: Build native deps (lame → ffmpeg → ish)
        run: |
          # VDSO needs lld; meson picks `clang` from PATH, so brew LLVM must lead.
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          # Real Alpine rootfs (alpine-rootfs.zip) — iSH sandbox needs it at
          # boot; requires the ish build above (fakefsify). Stub zip breaks
          # sandbox init with "Failed to open zip archive".
          ./deps/prepare_alpine_rootfs.sh

      - name: Pin Xcode 26.4.1 (stable)
        # macos-26 default Xcode moved 26.5 -> 26.6 on 2026-07-21 (runner-images
        # #14344). On this codebase xcodebuild under 26.6 dies SILENTLY mid-build
        # (no error output, ibtoold orphans — OOM signature). Pin the last
        # stable release so the build is reproducible across runner-image
        # rollouts. 3 consecutive failures on 2026-09-01 (3e78947) with 26.6.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Signing diagnostics
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          echo "APPLE_ID injected: $([ -n \"$APPLE_ID\" ] && echo yes || echo no)"
          echo "APPLE_ID_PASSWORD injected: $([ -n \"$APPLE_ID_PASSWORD\" ] && echo yes || echo no)"

      # KSign on-device signing path: CI ships an UNSIGNED ipa; the user's
      # iPhone signs it locally via KSign (free, no paid developer account).
      - name: Build (unsigned) + package ipa
        run: |
          cd src/ios
          # [Diag] Build fails with NO error output? Default WMO mode hides
          # compile errors (swift-frontend dies silently, Xcode 26 bug,
          # 2026-09-01: NSLock.tryLock() -> try() hid for 9 runs). Temporarily
          # add `SWIFT_COMPILATION_MODE=incremental OTHER_SWIFT_FLAGS="-Xfrontend
          # -disable-batch-mode"` to the xcodebuild args to surface the real
          # error, then revert.
          # SWIFT_NUM_THREADS=2: cap Swift compiler parallelism. macos-26
          # runner images changed in Aug 2026 and xcodebuild started dying
          # silently mid-build (no error output, ibtoold orphans) — consistent
          # with OOM on the default Swift thread count for this large mixed
          # codebase.
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_NUM_THREADS=2 \
            -derivedDataPath build/DerivedData
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/Minis.app build/Payload/
          # Auto-increment build number: CFBundleVersion = git commit count, so
          # every sideloaded ipa is distinguishable (monotonic, never repeats).
          BUILD_NO=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" build/Payload/Minis.app/Info.plist
          echo "CFBundleVersion set to $BUILD_NO"
          cd build && zip -qr Minis-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: src/ios/build/Minis-unsigned.ipa
          if-no-files-found: error

      # [doris] Release the ipa as a release asset (fixed tag, commit-suffixed
      # filename so every build URL is unique — no Safari cache/416). Asset
      # downloads work through gh.llkk.cc, unlike Actions artifact blobs.
      - name: Release unsigned .ipa
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          TAG="ipa-latest"
          NAME="Minis-unsigned-${SHA_SHORT:0:7}.ipa"
          cp src/ios/build/Minis-unsigned.ipa "$NAME"
          gh release create "$TAG" --title "Claudio unsigned builds" --notes "Latest main build — asset filename carries the commit hash." --clobber || true
          gh release upload "$TAG" "$NAME" --clobber
